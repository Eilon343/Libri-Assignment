server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unknown paths fall back to index.html so the
    # client-side app can handle routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend container over the internal Docker network.
    # "backend" is the service name from docker-compose.yml.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";

        # --- Server-Sent Events: stream events through instead of buffering ---
        proxy_buffering off;
        proxy_cache off;

        # The word fetch runs for ~3 minutes; keep the upstream connection open
        # well past nginx's 60s default so the SSE stream is not cut off.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
